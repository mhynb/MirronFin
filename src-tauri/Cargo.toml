[package]
name = "mirrorfin"
version = "0.1.0"
description = "MirrorFin - personal finance review"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = { version = "2", features = ["json", "unsafe-headers", "stream"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
